<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Groceries">
<meta name="theme-color" content="#e8efe9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b100f" media="(prefers-color-scheme: dark)">
<title>Groceries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column floating over a soft produce-colored wallpaper; glass surfaces on top. */
:root {
  --wall: #e8efe9;
  --blob-tomato: #ff7a59;
  --blob-leaf: #7cc95a;
  --blob-lemon: #ffd25a;
  --blob-sky: #5ec8f2;
  --text: #0f1513;
  --text-2: rgba(15, 21, 19, .58);
  --text-3: rgba(15, 21, 19, .38);
  --glass: rgba(255, 255, 255, .30);
  --glass-strong: rgba(250, 252, 251, .66);
  --glass-rim: rgba(255, 255, 255, .85);
  --glass-rim-dim: rgba(255, 255, 255, .25);
  --glass-shadow: rgba(24, 48, 36, .16);
  --hairline: rgba(15, 21, 19, .10);
  --field: rgba(255, 255, 255, .55);
  --accent: #0a7cff;
  --done: #2fc35a;
  --danger: #ff3b30;
  --white-btn: #ffffff;
  --white-btn-text: #0b0f0d;
  --paper: #fffdf7;
  --ink: #23211d;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --font-receipt: "Courier Prime", ui-monospace, "SF Mono", Menlo, monospace;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --wall: #0b100f;
    --blob-tomato: #b2412a;
    --blob-leaf: #2f7a3a;
    --blob-lemon: #8a6a14;
    --blob-sky: #1d5f86;
    --text: #f2f6f4;
    --text-2: rgba(242, 246, 244, .62);
    --text-3: rgba(242, 246, 244, .38);
    --glass: rgba(255, 255, 255, .08);
    --glass-strong: rgba(30, 34, 36, .62);
    --glass-rim: rgba(255, 255, 255, .38);
    --glass-rim-dim: rgba(255, 255, 255, .08);
    --glass-shadow: rgba(0, 0, 0, .45);
    --hairline: rgba(255, 255, 255, .10);
    --field: rgba(255, 255, 255, .08);
    --accent: #3d9bff;
    --done: #34d15e;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--wall);
  color: var(--text);
  font: 17px/1.35 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Wallpaper ---------- */
.wallpaper { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .85; }
.blob.a { width: 70vmax; height: 70vmax; background: var(--blob-tomato); top: -30vmax; right: -30vmax; animation: drift 28s ease-in-out infinite alternate; }
.blob.b { width: 60vmax; height: 60vmax; background: var(--blob-leaf); bottom: -25vmax; left: -25vmax; animation: drift 34s ease-in-out infinite alternate-reverse; }
.blob.c { width: 40vmax; height: 40vmax; background: var(--blob-lemon); top: 30%; left: -15vmax; animation: drift 24s ease-in-out infinite alternate; }
.blob.d { width: 38vmax; height: 38vmax; background: var(--blob-sky); bottom: 10%; right: -14vmax; animation: drift 30s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform: translate(6vmax, 5vmax) scale(1.08); } }

/* ---------- Glass material ---------- */
.glass, .glass-strong {
  position: relative;
  -webkit-backdrop-filter: blur(22px) saturate(185%);
  backdrop-filter: blur(22px) saturate(185%);
  box-shadow:
    inset 0 1px 1px var(--glass-rim),
    inset 0 -1px 1px var(--glass-rim-dim),
    0 10px 30px -8px var(--glass-shadow),
    0 2px 6px -2px var(--glass-shadow);
  isolation: isolate;
}
.glass { background: var(--glass); }
.glass-strong { background: var(--glass-strong); -webkit-backdrop-filter: blur(34px) saturate(190%); backdrop-filter: blur(34px) saturate(190%); }
/* specular rim: bright top-left and bottom-right edges */
.glass::before, .glass-strong::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: -1;
  background: linear-gradient(140deg, var(--glass-rim) 0%, transparent 32%, transparent 68%, var(--glass-rim) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  opacity: .9;
}
/* soft inner sheen */
.glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: radial-gradient(120% 60% at 20% 0%, rgba(255,255,255,.22), transparent 60%);
}
.press { transition: transform .35s var(--spring), filter .2s; }
.press:active { transform: scale(.96); filter: brightness(1.08); }

/* ---------- App shell ---------- */
.app {
  position: relative; z-index: 1;
  max-width: 520px; margin: 0 auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 28px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.title-block .eyebrow { margin: 0 0 2px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.title-block h1 { margin: 0; font: 700 34px/1.1 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }

.add-btn {
  display: flex; align-items: center; gap: 14px;
  width: 100%; padding: 14px 18px 14px 14px; border-radius: 26px; text-align: left;
}
.add-btn .plus {
  flex: none; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; background: var(--white-btn); color: var(--white-btn-text);
  box-shadow: 0 4px 14px -4px rgba(0,0,0,.25);
}
.add-btn .label { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.add-btn strong { font-size: 18px; font-weight: 600; }
.add-btn small { font-size: 14px; color: var(--text-2); }
.badge {
  flex: none; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 13px;
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 700;
  display: grid; place-items: center; font-variant-numeric: tabular-nums;
}

.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 4px -8px; }
.section-head h2 { margin: 0; font: 700 22px/1.2 var(--font-display); letter-spacing: -.01em; }
.section-head span { font-size: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }

.lists { display: flex; flex-direction: column; gap: 12px; }
.list-card {
  border-radius: 24px; padding: 12px 12px 12px 10px;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 10px;
  transition: opacity .35s, transform .45s var(--ease);
}
.list-card.fresh { animation: land .8s var(--spring); }
@keyframes land { from { transform: translateY(-24px) scale(.94); opacity: 0; } }
.check {
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%;
}
.check .ring {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--text-3); display: grid; place-items: center;
  transition: background .25s, border-color .25s, transform .4s var(--spring);
}
.check svg { opacity: 0; transform: scale(.4); transition: opacity .2s, transform .35s var(--spring); }
.list-card.done .check .ring { background: var(--done); border-color: var(--done); transform: scale(1.08); }
.list-card.done .check svg { opacity: 1; transform: scale(1); }
.list-card.done .list-title { text-decoration: line-through; color: var(--text-2); }
.list-main { text-align: left; min-width: 0; padding: 4px 0; display: flex; flex-direction: column; gap: 4px; }
.list-title { font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-meta { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-2); flex-wrap: wrap; }
.date-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 10px; font-size: 13px; font-weight: 600;
  background: var(--field); color: var(--text);
}
.date-pill.none { color: var(--text-2); font-weight: 500; }
.date-pill.soon { background: var(--accent); color: #fff; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none;
}
.list-items { grid-column: 1 / -1; padding: 6px 6px 2px 56px; }
.list-items ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list-items li { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--hairline); font-size: 15px; }
.list-items li:first-child { border-top: 0; }
.qty { flex: none; min-width: 34px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.item-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item-src { font-size: 12px; color: var(--text-3); align-self: center; text-align: right; }
.chev { transition: transform .3s var(--ease); color: var(--text-3); }
.list-main[aria-expanded="true"] .chev { transform: rotate(90deg); }

.empty {
  border-radius: 24px; padding: 28px 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.empty .art { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--field); margin-bottom: 4px; }
.empty strong { font-size: 18px; }
.empty p { margin: 0; color: var(--text-2); font-size: 15px; max-width: 30ch; }

/* ---------- Sheet ---------- */
.backdrop {
  position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.18);
  opacity: 0; transition: opacity .3s;
}
.backdrop.show { opacity: 1; }
.sheet {
  position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 540px;
  max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px);
  border-radius: 34px 34px 0 0;
  padding: 8px max(18px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 22px) max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column;
  transform: translateY(105%); transition: transform .5s var(--ease);
}
@media (min-width: 560px) { .sheet { bottom: 16px; border-radius: 34px; } }
.sheet.show { transform: translateY(0); }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--text-3); margin: 0 auto 6px; flex: none; }
.sheet-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; flex: none; margin-bottom: 10px; }
.sheet-head h3 { margin: 0; text-align: center; font-size: 17px; font-weight: 600; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 4px; }
.view { display: flex; flex-direction: column; gap: 14px; animation: viewIn .38s var(--ease); }
.view.back-in { animation-name: viewBack; }
@keyframes viewIn { from { opacity: 0; transform: translateX(28px); } }
@keyframes viewBack { from { opacity: 0; transform: translateX(-28px); } }

.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex; align-items: center; gap: 14px; text-align: left;
  padding: 14px 16px 14px 14px; border-radius: 22px; width: 100%;
}
.option .ic { flex: none; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: #fff; }
.option .ic.meal { background: linear-gradient(160deg, #ff9a62, #ff5e3a); }
.option .ic.item { background: linear-gradient(160deg, #5ed0ff, #1f8fff); }
.option .ic.new { background: linear-gradient(160deg, #8ee26b, #2fb553); }
.option span.t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.option strong { font-weight: 600; }
.option small { color: var(--text-2); font-size: 14px; }

.draft { border-radius: 20px; padding: 8px 14px; }
.draft-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); }
.draft ul { list-style: none; margin: 0; padding: 0; }
.draft li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--hairline); font-size: 15px; }
.remove { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); flex: none; }

.white-btn {
  width: 100%; height: 54px; border-radius: 27px;
  background: var(--white-btn); color: var(--white-btn-text);
  font-size: 17px; font-weight: 600;
  box-shadow: 0 10px 24px -10px rgba(0,0,0,.35), inset 0 -1px 0 rgba(0,0,0,.06);
  transition: transform .35s var(--spring), opacity .2s;
}
.white-btn:active { transform: scale(.97); }
.white-btn:disabled { opacity: .45; }
.white-btn.appear { animation: pop .55s var(--spring); }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.9); } }
.round-plus {
  width: 64px; height: 64px; border-radius: 50%; margin: 4px auto 0;
  background: var(--white-btn); color: var(--white-btn-text);
  display: grid; place-items: center;
  box-shadow: 0 12px 26px -10px rgba(0,0,0,.4);
  transition: transform .35s var(--spring), opacity .2s;
}
.round-plus:active { transform: scale(.92); }
.round-plus:disabled { opacity: .45; }
.text-btn { height: 46px; border-radius: 23px; width: 100%; font-weight: 600; color: var(--text); }

.field-row { display: flex; gap: 10px; align-items: stretch; }
.field {
  flex: 1; min-width: 0; height: 52px; padding: 0 16px; border-radius: 16px;
  border: 1px solid var(--hairline); background: var(--field); font-size: 17px; outline: none;
}
.view > .field { flex: none; }
.field:focus { border-color: var(--accent); }
.field::placeholder { color: var(--text-3); }
.stepper {
  flex: none; display: flex; align-items: center; height: 52px; border-radius: 16px;
  border: 1px solid var(--hairline); background: var(--field); overflow: hidden;
}
.stepper button { width: 34px; height: 100%; display: grid; place-items: center; color: var(--text-2); font-size: 20px; }
.stepper input {
  width: 52px; height: 100%; border: 0; background: none; text-align: center; font-size: 17px; outline: none; padding: 0;
  font-variant-numeric: tabular-nums;
}
.field-label { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); margin: 4px 4px -6px; }
.hint { font-size: 14px; color: var(--text-2); margin: -4px 4px 0; }

.meal-list { display: flex; flex-direction: column; gap: 10px; }
.meal { border-radius: 20px; display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 0; }
.meal-main { flex: 1; min-width: 0; text-align: left; padding: 8px 8px 8px 16px; display: flex; flex-direction: column; gap: 2px; }
.meal-main strong { font-weight: 600; }
.meal-main small { color: var(--text-2); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meal .del { height: 36px; min-width: 36px; padding: 0 8px; border-radius: 18px; color: var(--text-2); display: grid; place-items: center; font-size: 14px; font-weight: 600; transition: background .2s, color .2s; }
.meal .del.armed { background: var(--danger); color: #fff; padding: 0 14px; }

.ingredients { border-radius: 20px; padding: 4px 14px; }
.ingredients ul { list-style: none; margin: 0; padding: 0; }
.ingredients li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--hairline); font-size: 16px; }
.ingredients li.new { animation: pop .4s var(--spring); }
.ingredients li:first-child { border-top: 0; }
.ingredients .none { color: var(--text-3); font-size: 15px; padding: 10px 0; text-align: center; }
.small-plus { flex: none; width: 52px; height: 52px; border-radius: 16px; background: var(--white-btn); color: var(--white-btn-text); display: grid; place-items: center; box-shadow: 0 6px 16px -8px rgba(0,0,0,.35); }
.small-plus:disabled { opacity: .45; }

/* ---------- Printer stage ---------- */
.stage {
  position: fixed; inset: 0; z-index: 40;
  display: flex; flex-direction: column; align-items: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 28px);
  background: rgba(0,0,0,.0);
  -webkit-backdrop-filter: blur(0px); backdrop-filter: blur(0px);
  transition: background .4s, backdrop-filter .4s, -webkit-backdrop-filter .4s;
  overflow: hidden;
}
.stage.show { background: rgba(0,0,0,.22); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.printer-wrap { position: relative; width: 300px; max-width: calc(100% - 32px); display: flex; flex-direction: column; align-items: center; transition: transform .6s var(--ease), opacity .5s; }
.printer {
  width: 100%; height: 74px; border-radius: 26px; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
  animation: printerIn .5s var(--spring);
}
@keyframes printerIn { from { transform: translateY(-40px) scale(.9); opacity: 0; } }
.printer.busy { animation: buzz .09s linear infinite; }
@keyframes buzz { 50% { transform: translateY(.6px); } }
.printer .brand { font: 700 12px/1 var(--font-receipt); letter-spacing: .2em; color: var(--text-2); }
.led { width: 9px; height: 9px; border-radius: 50%; background: var(--text-3); transition: background .3s, box-shadow .3s; }
.printer.busy .led { background: var(--done); box-shadow: 0 0 10px var(--done); }
.slot {
  position: absolute; left: 30px; right: 30px; top: 60px; height: 8px; border-radius: 4px; z-index: 3;
  background: linear-gradient(#0008, #0003); box-shadow: inset 0 1px 2px #000a;
}
.paper-clip { position: relative; width: 252px; margin-top: -10px; overflow: hidden; padding: 0 0 30px; z-index: 1; }
.paper-clip.free { overflow: visible; }
.mover { perspective: 1100px; transform-origin: 50% 0; }
.spinner { position: relative; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
.face {
  background: var(--paper); color: var(--ink);
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
  -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 14px 8px repeat-x;
  mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 14px 8px repeat-x;
}
.face.front { padding: 22px 18px 30px; font: 13px/1.45 var(--font-receipt); box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); }
.face.back {
  position: absolute; inset: 0; transform: rotateY(180deg);
  display: grid; place-items: center;
  background:
    repeating-linear-gradient(0deg, transparent 0 23px, rgba(35,33,29,.05) 23px 24px),
    var(--paper);
}
.face.back span { font: 700 14px/1.4 var(--font-receipt); letter-spacing: .3em; color: rgba(35,33,29,.35); writing-mode: vertical-rl; }
.r-center { text-align: center; }
.r-title { font-weight: 700; font-size: 16px; letter-spacing: .12em; }
.r-rule { border: 0; border-top: 1px dashed rgba(35,33,29,.5); margin: 10px 0; }
.r-row { display: flex; gap: 10px; }
.r-row .q { flex: none; min-width: 36px; white-space: nowrap; }
.r-row .n { flex: 1; min-width: 0; overflow-wrap: anywhere; text-transform: uppercase; }
.r-small { font-size: 11px; color: rgba(35,33,29,.7); }
.r-bars { height: 34px; margin: 12px 8px 0; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 12px); }

.schedule {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 540px; z-index: 5;
  border-radius: 34px 34px 0 0;
  padding: 22px max(20px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px;
  transform: translateY(110%); transition: transform .6s var(--ease);
}
@media (min-width: 560px) { .schedule { bottom: 16px; border-radius: 34px; } }
.schedule.show { transform: translateY(0); }
.schedule h2 { margin: 0; font: 700 22px/1.2 var(--font-display); }
.schedule p { margin: -6px 0 2px; color: var(--text-2); font-size: 15px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 38px; padding: 0 16px; border-radius: 19px; font-size: 15px; font-weight: 600; background: var(--field); border: 1px solid var(--hairline); transition: background .2s, color .2s, transform .3s var(--spring); }
.chip:active { transform: scale(.95); }
.chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.date-field { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 54px; padding: 0 8px 0 16px; border-radius: 16px; background: var(--field); border: 1px solid var(--hairline); }
.date-field span { font-weight: 500; }
.date-field input { border: 0; background: none; font-size: 17px; color: var(--accent); min-width: 0; text-align: right; outline: none; min-height: 40px; }
.sched-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; z-index: 50; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  transform: translate(-50%, 160%); transition: transform .5s var(--spring), visibility .5s; visibility: hidden;
  display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 20px; border-radius: 26px; white-space: nowrap; font-size: 15px;
}
.toast.show { transform: translate(-50%, 0); visibility: visible; }
.toast button { height: 36px; padding: 0 16px; border-radius: 18px; background: var(--white-btn); color: var(--white-btn-text); font-weight: 600; }

#printArea { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- Printing ---------- */
@media print {
  @page { margin: 16mm; }
  body { background: #fff !important; color: #000; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block !important; font: 12pt/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #000; }
  .p-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2pt solid #000; padding-bottom: 6pt; margin-bottom: 4pt; }
  .p-head h1 { margin: 0; font-size: 22pt; letter-spacing: -.01em; }
  .p-head .p-date { font-size: 12pt; font-weight: 600; text-align: right; }
  .p-meals { margin: 6pt 0 12pt; font-size: 11pt; color: #333; }
  .p-items { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 28pt; }
  .p-items li { break-inside: avoid; display: flex; gap: 8pt; align-items: baseline; padding: 5pt 0; border-bottom: .5pt solid #bbb; }
  .p-box { flex: none; width: 10pt; height: 10pt; border: 1pt solid #000; border-radius: 2pt; transform: translateY(1pt); }
  .p-q { flex: none; min-width: 28pt; font-weight: 600; }
  .p-n { flex: 1; }
  .p-src { font-size: 9pt; color: #666; }
  .p-foot { margin-top: 14pt; font-size: 9pt; color: #666; }
}
</style>
</head>
<body>

<div class="wallpaper" aria-hidden="true"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div><div class="blob d"></div></div>

<main class="app">
  <header class="title-block">
    <p class="eyebrow" id="today"></p>
    <h1>Groceries</h1>
  </header>

  <button class="add-btn glass press" id="addBtn">
    <span class="plus"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    <span class="label"><strong id="addTitle">Add</strong><small id="addSub">Meals and items for a new list</small></span>
    <span class="badge" id="addBadge" hidden>0</span>
  </button>

  <div class="section-head"><h2>Current Lists</h2><span id="listCount"></span></div>
  <section class="lists" id="lists" aria-live="polite"></section>
</main>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet glass-strong" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grabber"></div>
  <div class="sheet-head">
    <button class="icon-btn glass press" id="sheetBack" aria-label="Back"></button>
    <h3 id="sheetTitle">Add to List</h3>
    <span></span>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="stage" id="stage" hidden>
  <div class="printer-wrap" id="printerWrap">
    <div class="printer glass" id="printer"><span class="brand">LIST-O-MATIC</span><span class="led"></span></div>
    <div class="slot"></div>
    <div class="paper-clip" id="paperClip">
      <div class="mover" id="mover">
        <div class="spinner" id="spinner">
          <div class="face front" id="receiptFront"></div>
          <div class="face back"><span>GROCERIES</span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="schedule glass-strong" id="schedule">
    <h2>Schedule this list</h2>
    <p>Pick a shopping day, or skip it.</p>
    <div class="chips" id="chips"></div>
    <label class="date-field"><span>Date</span><input type="date" id="schedDate"></label>
    <div class="sched-actions">
      <button class="white-btn" id="schedGo" disabled>Schedule</button>
      <button class="text-btn press" id="schedSkip">Skip</button>
    </div>
  </div>
</div>

<div class="toast glass-strong" id="toast" role="status"><span id="toastText"></span><button id="toastUndo">Undo</button></div>

<div id="printArea"></div>

<script>
(() => {
  "use strict";

  /* ---------- Helpers ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const ICON = {
    close: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    chev: '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    printer: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2.5"/><path d="M7 14h10v7H7z" fill="var(--glass-strong)"/><circle cx="17.5" cy="11" r=".6" fill="currentColor"/></svg>',
    plus: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    plusSm: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    x: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    trash: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    meal: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h18a9 9 0 0 1-18 0z"/><path d="M8 9c0-2 2-2 2-4M12 9c0-2 2-2 2-4M16 9c0-2 2-2 2-4" opacity=".85"/></svg>',
    item: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-3-3-8-1-8 4 0 5 4 10 8 10s8-5 8-10c0-5-5-7-8-4z"/><path d="M12 7c0-2 1-4 3-4"/></svg>',
    newMeal: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg>',
    cart: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 7H6.3"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>'
  };

  /* ---------- Storage ---------- */
  const KEY = "groceries.v1";
  const SAMPLE_MEALS = [
    { id: uid(), name: "Chicken Tacos", ingredients: [
      { name: "Chicken thighs", qty: "1.5 lb" }, { name: "Corn tortillas", qty: "1" }, { name: "Avocado", qty: "2" },
      { name: "Lime", qty: "2" }, { name: "Cilantro", qty: "1" }, { name: "Salsa", qty: "1" } ] },
    { id: uid(), name: "Spaghetti Bolognese", ingredients: [
      { name: "Spaghetti", qty: "1 lb" }, { name: "Ground beef", qty: "1 lb" }, { name: "Crushed tomatoes", qty: "28 oz" },
      { name: "Onion", qty: "1" }, { name: "Garlic", qty: "1" }, { name: "Parmesan", qty: "1" } ] }
  ];
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        return { lists: d.lists || [], meals: d.meals || [], draft: d.draft || { items: [], meals: [] } };
      }
    } catch (e) {}
    return { lists: [], meals: SAMPLE_MEALS, draft: { items: [], meals: [] } };
  }
  const S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  /* ---------- Quantities ---------- */
  const NUM = /^(\d+(?:\.\d+)?)\s*(.*)$/;
  function fmtNum(n) { return String(Math.round(n * 100) / 100); }
  function combineQty(qs) {
    qs = qs.map(q => String(q || "").trim() || "1");
    if (qs.length === 1) return qs[0];
    const parsed = qs.map(q => q.match(NUM));
    if (parsed.every(Boolean)) {
      const unit = parsed[0][2].toLowerCase();
      if (parsed.every(p => p[2].toLowerCase() === unit)) {
        const total = parsed.reduce((a, p) => a + parseFloat(p[1]), 0);
        return (fmtNum(total) + " " + parsed[0][2]).trim();
      }
    }
    return qs.join(" + ");
  }
  function merged(items) {
    const map = new Map();
    for (const it of items) {
      const k = it.name.trim().toLowerCase();
      if (!map.has(k)) map.set(k, { name: it.name.trim(), qtys: [], sources: new Set() });
      const m = map.get(k);
      m.qtys.push(it.qty);
      if (it.source) m.sources.add(it.source);
    }
    return [...map.values()].map(m => ({ name: m.name, qty: combineQty(m.qtys), sources: [...m.sources] }));
  }
  function stepQty(v, dir) {
    const m = String(v || "").trim().match(NUM);
    if (!m) return dir > 0 ? "2" : "1";
    const n = Math.max(1, Math.floor(parseFloat(m[1])) + dir);
    return (n + " " + m[2]).trim();
  }

  /* ---------- Dates ---------- */
  const pad = n => String(n).padStart(2, "0");
  const isoDay = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  function dayDiff(s) { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((parseDay(s) - t) / 864e5); }
  function shortDate(s) {
    const diff = dayDiff(s);
    if (diff === 0) return "Today";
    if (diff === 1) return "Tomorrow";
    return parseDay(s).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  const longDate = s => parseDay(s).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });

  function listTitle(l) {
    if (l.meals && l.meals.length) {
      const m = [...new Set(l.meals)];
      return m.length <= 2 ? m.join(" & ") : m.slice(0, 2).join(", ") + " + " + (m.length - 2) + " more";
    }
    return "Shopping List";
  }

  /* ---------- Home ---------- */
  const listsEl = $("#lists");
  let freshId = null;
  const expanded = new Set();

  function sortedLists() {
    return [...S.lists].sort((a, b) => {
      if (a.date && b.date) return a.date.localeCompare(b.date);
      if (a.date) return -1;
      if (b.date) return 1;
      return b.created - a.created;
    });
  }

  function renderHome() {
    $("#today").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    const n = S.draft.items.length;
    $("#addBadge").hidden = !n;
    $("#addBadge").textContent = n;
    $("#addTitle").textContent = n ? "Continue list" : "Add";
    $("#addSub").textContent = n ? n + (n === 1 ? " item" : " items") + " waiting to be finished" : "Meals and items for a new list";
    $("#listCount").textContent = S.lists.length ? S.lists.length + (S.lists.length === 1 ? " list" : " lists") : "";

    if (!S.lists.length) {
      listsEl.innerHTML = `<div class="empty glass"><div class="art">${ICON.cart}</div><strong>No lists yet</strong><p>Tap Add to build a shopping list from your meals or single items.</p></div>`;
      return;
    }
    listsEl.innerHTML = sortedLists().map(l => {
      const items = merged(l.items);
      const open = expanded.has(l.id);
      let pill = '<span class="date-pill none">No date</span>';
      if (l.date) {
        const d = dayDiff(l.date);
        pill = `<span class="date-pill${d >= 0 && d <= 1 ? " soon" : ""}">${esc(shortDate(l.date))}</span>`;
      }
      return `<article class="list-card glass${l.id === freshId ? " fresh" : ""}" data-id="${l.id}">
        <button class="check" data-act="check" aria-label="Mark ${esc(listTitle(l))} as done"><span class="ring">${ICON.check}</span></button>
        <button class="list-main" data-act="toggle" aria-expanded="${open}">
          <span class="list-title">${esc(listTitle(l))}</span>
          <span class="list-meta">${pill}<span>${items.length} ${items.length === 1 ? "item" : "items"}</span>${ICON.chev}</span>
        </button>
        <button class="icon-btn glass press" data-act="print" aria-label="Print list">${ICON.printer}</button>
        <div class="list-items"${open ? "" : " hidden"}><ul>${items.map(i => `<li><span class="qty">${esc(i.qty)}</span><span class="item-name">${esc(i.name)}</span>${i.sources.length ? `<span class="item-src">${esc(i.sources.join(", "))}</span>` : ""}</li>`).join("")}</ul></div>
      </article>`;
    }).join("");
    freshId = null;
  }

  listsEl.addEventListener("click", e => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const card = btn.closest(".list-card");
    const id = card.dataset.id;
    const act = btn.dataset.act;
    if (act === "toggle") {
      const open = !expanded.has(id);
      open ? expanded.add(id) : expanded.delete(id);
      btn.setAttribute("aria-expanded", open);
      card.querySelector(".list-items").hidden = !open;
    } else if (act === "print") {
      printList(S.lists.find(l => l.id === id));
    } else if (act === "check") {
      completeList(card, id);
    }
  });

  let undoTimer = null, lastRemoved = null;
  async function completeList(card, id) {
    if (card.classList.contains("done")) return;
    card.classList.add("done");
    await wait(reduced ? 0 : 520);
    card.style.height = card.offsetHeight + "px";
    card.style.overflow = "hidden";
    card.getBoundingClientRect();
    card.style.transition = "height .35s var(--ease), opacity .3s, transform .35s var(--ease), padding .35s, margin .35s";
    card.style.height = "0px"; card.style.opacity = "0"; card.style.transform = "scale(.92)";
    card.style.paddingTop = "0px"; card.style.paddingBottom = "0px"; card.style.marginBottom = "-12px";
    await wait(reduced ? 0 : 360);
    const idx = S.lists.findIndex(l => l.id === id);
    if (idx < 0) return;
    lastRemoved = { list: S.lists[idx], idx };
    S.lists.splice(idx, 1);
    expanded.delete(id);
    save(); renderHome();
    showToast("List removed");
  }
  function showToast(text) {
    $("#toastText").textContent = text;
    $("#toast").classList.add("show");
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => { $("#toast").classList.remove("show"); lastRemoved = null; }, 4500);
  }
  $("#toastUndo").addEventListener("click", () => {
    if (lastRemoved) {
      S.lists.splice(lastRemoved.idx, 0, lastRemoved.list);
      freshId = lastRemoved.list.id;
      lastRemoved = null; save(); renderHome();
    }
    $("#toast").classList.remove("show");
  });

  /* ---------- Printing ---------- */
  function printList(l) {
    if (!l) return;
    const items = merged(l.items);
    const meals = [...new Set(l.meals || [])];
    $("#printArea").innerHTML = `
      <div class="p-head"><h1>${esc(listTitle(l))}</h1><div class="p-date">${l.date ? esc(longDate(l.date)) : "Shopping List"}</div></div>
      ${meals.length ? `<div class="p-meals"><strong>Meals:</strong> ${esc(meals.join(" · "))}</div>` : '<div class="p-meals"></div>'}
      <ul class="p-items">${items.map(i => `<li><span class="p-box"></span><span class="p-q">${esc(i.qty)}</span><span class="p-n">${esc(i.name)}${i.sources.length ? ` <span class="p-src">(${esc(i.sources.join(", "))})</span>` : ""}</span></li>`).join("")}</ul>
      <div class="p-foot">${items.length} items · printed ${esc(new Date().toLocaleDateString())}</div>`;
    window.print();
  }

  /* ---------- Sheet ---------- */
  const sheet = $("#sheet"), backdrop = $("#backdrop"), body = $("#sheetBody"), backBtn = $("#sheetBack");
  let view = "menu";
  let nm = { name: "", ingredients: [] };   // meal being made
  let armedDelete = null;

  function openSheet() {
    backdrop.hidden = false; sheet.hidden = false;
    requestAnimationFrame(() => { backdrop.classList.add("show"); sheet.classList.add("show"); });
    show("menu");
  }
  function closeSheet() {
    backdrop.classList.remove("show"); sheet.classList.remove("show");
    setTimeout(() => { backdrop.hidden = true; sheet.hidden = true; }, 450);
    renderHome();
  }
  $("#addBtn").addEventListener("click", openSheet);
  backdrop.addEventListener("click", closeSheet);
  backBtn.addEventListener("click", () => view === "menu" ? closeSheet() : show("menu", true));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) backBtn.click(); });

  function show(v, goingBack) {
    view = v; armedDelete = null;
    backBtn.innerHTML = v === "menu" ? ICON.close : ICON.back;
    backBtn.setAttribute("aria-label", v === "menu" ? "Close" : "Back");
    $("#sheetTitle").textContent = { menu: "Add to List", meals: "Pre-Planned Meals", item: "Random Item", newMeal: "New Meal" }[v];
    ({ menu: renderMenu, meals: renderMeals, item: renderItem, newMeal: renderNewMeal })[v]();
    const el = body.firstElementChild;
    if (el && goingBack) el.classList.add("back-in");
    body.scrollTop = 0;
  }

  function addToDraft(items, mealName) {
    for (const it of items) S.draft.items.push({ id: uid(), name: it.name.trim(), qty: String(it.qty || "1").trim() || "1", source: mealName || null });
    if (mealName) S.draft.meals.push(mealName);
    save();
    justAdded = true;
    show("menu", true);
  }
  let justAdded = false;

  function renderMenu() {
    const d = S.draft.items;
    const mealsCount = S.meals.length;
    body.innerHTML = `<div class="view">
      ${d.length ? `<div class="draft glass"><div class="draft-head"><span>In this list</span><span>${merged(d).length}</span></div><ul>${d.map(i => `<li><span class="qty">${esc(i.qty)}</span><span class="item-name">${esc(i.name)}</span>${i.source ? `<span class="item-src">${esc(i.source)}</span>` : ""}<button class="remove" data-rm="${i.id}" aria-label="Remove ${esc(i.name)}">${ICON.x}</button></li>`).join("")}</ul></div>` : ""}
      <div class="options">
        <button class="option glass press" data-go="meals"><span class="ic meal">${ICON.meal}</span><span class="t"><strong>Add Pre-Planned Meal</strong><small>${mealsCount ? mealsCount + " saved " + (mealsCount === 1 ? "meal" : "meals") : "No saved meals yet"}</small></span>${ICON.chev}</button>
        <button class="option glass press" data-go="item"><span class="ic item">${ICON.item}</span><span class="t"><strong>Add Random Item</strong><small>One thing, any amount</small></span>${ICON.chev}</button>
        <button class="option glass press" data-go="newMeal"><span class="ic new">${ICON.newMeal}</span><span class="t"><strong>Make New Meal</strong><small>Saved for next time</small></span>${ICON.chev}</button>
      </div>
      ${d.length ? `<button class="white-btn${justAdded ? " appear" : ""}" id="finishBtn">Finish</button>` : ""}
    </div>`;
    justAdded = false;
  }

  function renderItem() {
    body.innerHTML = `<div class="view">
      <div class="field-row">
        <input class="field" id="itemName" placeholder="Item, e.g. Bananas" autocomplete="off" enterkeyhint="done" aria-label="Item name">
        <div class="stepper" role="group" aria-label="Quantity">
          <button data-step="-1" aria-label="Less">−</button>
          <input id="itemQty" value="1" inputmode="text" autocomplete="off" aria-label="Quantity">
          <button data-step="1" aria-label="More">+</button>
        </div>
      </div>
      <p class="hint">Quantity can include a unit, like “2 lb”.</p>
      <button class="round-plus" id="itemAdd" aria-label="Add to list" disabled>${ICON.plus}</button>
    </div>`;
    const name = $("#itemName"), add = $("#itemAdd");
    name.addEventListener("input", () => { add.disabled = !name.value.trim(); });
    name.addEventListener("keydown", e => { if (e.key === "Enter" && name.value.trim()) add.click(); });
    setTimeout(() => name.focus(), 350);
  }

  function renderMeals() {
    if (!S.meals.length) {
      body.innerHTML = `<div class="view"><div class="empty glass"><div class="art">${ICON.meal}</div><strong>No saved meals</strong><p>Meals you make with Make New Meal show up here.</p></div>
        <button class="white-btn" data-go="newMeal">Make New Meal</button></div>`;
      return;
    }
    body.innerHTML = `<div class="view"><p class="hint" style="margin-top:0">Tap a meal to add its ingredients.</p><div class="meal-list">${
      [...S.meals].sort((a, b) => a.name.localeCompare(b.name)).map(m => `<div class="meal glass" data-meal="${m.id}">
        <button class="meal-main press" data-pick="${m.id}"><strong>${esc(m.name)}</strong><small>${m.ingredients.length} ingredients · ${esc(m.ingredients.map(i => i.name).join(", "))}</small></button>
        <button class="del" data-del="${m.id}" aria-label="Delete ${esc(m.name)}">${ICON.trash}</button>
      </div>`).join("")
    }</div></div>`;
  }

  function renderNewMeal() {
    body.innerHTML = `<div class="view">
      <div class="field-label">Meal name</div>
      <input class="field" id="mealName" placeholder="e.g. Sunday Roast" autocomplete="off" value="${esc(nm.name)}" aria-label="Meal name">
      <div class="field-label">Ingredients</div>
      <div class="ingredients glass"><ul id="ingList"></ul></div>
      <div class="field-row">
        <input class="field" id="ingName" placeholder="Ingredient" autocomplete="off" enterkeyhint="next" aria-label="Ingredient name">
        <div class="stepper" role="group" aria-label="Quantity">
          <button data-step="-1" aria-label="Less">−</button>
          <input id="ingQty" value="1" autocomplete="off" aria-label="Quantity">
          <button data-step="1" aria-label="More">+</button>
        </div>
      </div>
      <button class="text-btn glass press" id="ingAdd">Add ingredient</button>
      <button class="white-btn" id="mealAdd">Add Meal</button>
    </div>`;
    renderIngredients();
    $("#mealName").addEventListener("input", e => { nm.name = e.target.value; updateMealBtn(); });
    $("#ingName").addEventListener("input", updateMealBtn);
    $("#ingName").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addIngredient(); } });
    $("#ingAdd").addEventListener("click", addIngredient);
    if (!nm.name) setTimeout(() => $("#mealName").focus(), 350);
  }
  let lastIng = -1;
  function renderIngredients() {
    const ul = $("#ingList");
    ul.innerHTML = nm.ingredients.length
      ? nm.ingredients.map((i, k) => `<li${k === lastIng ? ' class="new"' : ""}><span class="qty">${esc(i.qty)}</span><span class="item-name">${esc(i.name)}</span><button class="remove" data-ing="${k}" aria-label="Remove ${esc(i.name)}">${ICON.x}</button></li>`).join("")
      : '<li class="none">Add ingredients one at a time below.</li>';
    lastIng = -1;
    updateMealBtn();
  }
  function addIngredient() {
    const n = $("#ingName"), q = $("#ingQty");
    if (!n.value.trim()) { n.focus(); return; }
    nm.ingredients.push({ name: n.value.trim(), qty: q.value.trim() || "1" });
    n.value = ""; q.value = "1";
    lastIng = nm.ingredients.length - 1;
    renderIngredients();
    n.focus();
  }
  function updateMealBtn() {
    const btn = $("#mealAdd");
    if (!btn) return;
    const pending = $("#ingName") && $("#ingName").value.trim();
    btn.disabled = !nm.name.trim() || !(nm.ingredients.length || pending);
  }

  body.addEventListener("click", e => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.go) return show(t.dataset.go);
    if (t.dataset.step) {
      const input = t.parentElement.querySelector("input");
      input.value = stepQty(input.value, +t.dataset.step);
      return;
    }
    if (t.dataset.rm) {
      const i = S.draft.items.find(x => x.id === t.dataset.rm);
      S.draft.items = S.draft.items.filter(x => x.id !== t.dataset.rm);
      if (i && i.source && !S.draft.items.some(x => x.source === i.source)) S.draft.meals = S.draft.meals.filter(m => m !== i.source);
      save(); renderMenu(); return;
    }
    if (t.id === "itemAdd") {
      const name = $("#itemName").value.trim();
      if (name) addToDraft([{ name, qty: $("#itemQty").value }]);
      return;
    }
    if (t.dataset.pick) {
      const m = S.meals.find(x => x.id === t.dataset.pick);
      if (m) addToDraft(m.ingredients, m.name);
      return;
    }
    if (t.dataset.del) {
      if (armedDelete === t.dataset.del) {
        S.meals = S.meals.filter(m => m.id !== t.dataset.del);
        save(); armedDelete = null; renderMeals();
      } else {
        body.querySelectorAll(".del.armed").forEach(b => { b.classList.remove("armed"); b.innerHTML = ICON.trash; });
        armedDelete = t.dataset.del;
        t.classList.add("armed"); t.textContent = "Delete";
      }
      return;
    }
    if (t.dataset.ing) {
      nm.ingredients.splice(+t.dataset.ing, 1); renderIngredients(); return;
    }
    if (t.id === "mealAdd") {
      const pending = $("#ingName").value.trim();
      if (pending) nm.ingredients.push({ name: pending, qty: $("#ingQty").value.trim() || "1" });
      const name = nm.name.trim();
      if (!name || !nm.ingredients.length) return;
      const meal = { id: uid(), name, ingredients: nm.ingredients.map(i => ({ ...i })) };
      const existing = S.meals.findIndex(m => m.name.toLowerCase() === name.toLowerCase());
      if (existing >= 0) { meal.id = S.meals[existing].id; S.meals[existing] = meal; } else S.meals.push(meal);
      nm = { name: "", ingredients: [] };
      addToDraft(meal.ingredients, meal.name);
      return;
    }
    if (t.id === "finishBtn") return finish();
  });

  /* ---------- Finish: receipt printer ---------- */
  const stage = $("#stage"), printer = $("#printer"), printerWrap = $("#printerWrap"), clip = $("#paperClip"),
        mover = $("#mover"), spinner = $("#spinner"), schedule = $("#schedule"), dateInput = $("#schedDate"), goBtn = $("#schedGo");
  let spinAnim = null, pending = null;

  function receiptHTML(draft) {
    const items = merged(draft.items);
    const MAX = 12;
    const shown = items.slice(0, MAX);
    const now = new Date();
    const meals = [...new Set(draft.meals)];
    return `<div class="r-center r-title">SHOPPING LIST</div>
      <div class="r-center r-small">${esc(now.toLocaleDateString(undefined, { month: "2-digit", day: "2-digit", year: "2-digit" }))} &nbsp; ${esc(now.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }))}</div>
      <hr class="r-rule">
      ${meals.length ? `<div class="r-small">MEALS: ${esc(meals.join(", ").toUpperCase())}</div><hr class="r-rule">` : ""}
      ${shown.map(i => `<div class="r-row"><span class="q">${esc(i.qty)}</span><span class="n">${esc(i.name)}</span></div>`).join("")}
      ${items.length > MAX ? `<div class="r-row"><span class="q"></span><span class="n">+ ${items.length - MAX} MORE</span></div>` : ""}
      <hr class="r-rule">
      <div class="r-row"><span class="n">ITEMS</span><span>${items.length}</span></div>
      <div class="r-bars"></div>
      <div class="r-center r-small" style="margin-top:8px">HAPPY COOKING</div>`;
  }

  function buildChips() {
    const t = new Date();
    let sat = addDays(t, (6 - t.getDay() + 7) % 7 || 7);
    const opts = [["Today", t], ["Tomorrow", addDays(t, 1)]];
    if ((sat - t) / 864e5 > 1.5) opts.push([sat.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }), sat]);
    else opts.push(["Next week", addDays(t, 7)]);
    $("#chips").innerHTML = opts.map(([label, d]) => `<button class="chip" data-day="${isoDay(d)}">${esc(label)}</button>`).join("");
  }
  $("#chips").addEventListener("click", e => {
    const c = e.target.closest(".chip");
    if (!c) return;
    dateInput.value = c.dataset.day;
    syncChips();
  });
  function syncChips() {
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.day === dateInput.value));
    goBtn.disabled = !dateInput.value;
  }
  dateInput.addEventListener("input", syncChips);
  dateInput.addEventListener("change", syncChips);

  async function finish() {
    if (!S.draft.items.length) return;
    pending = { id: uid(), created: Date.now(), date: null, items: S.draft.items.map(({ name, qty, source }) => ({ name, qty, source })), meals: [...S.draft.meals] };
    $("#receiptFront").innerHTML = receiptHTML(S.draft);
    closeSheet();

    // reset stage
    dateInput.value = ""; dateInput.min = isoDay(new Date()); buildChips(); syncChips();
    clip.classList.remove("free");
    printerWrap.style.transform = ""; printerWrap.style.opacity = "";
    mover.getAnimations().forEach(a => a.cancel());
    spinner.getAnimations().forEach(a => a.cancel());
    mover.style.transform = "translateY(-100%)";
    schedule.classList.remove("show");
    stage.hidden = false;
    // restart printer intro animation
    printer.style.animation = "none"; printer.offsetHeight; printer.style.animation = "";
    await wait(30);
    stage.classList.add("show");
    await wait(reduced ? 0 : 650);

    // print: paper feeds out of the slot with a slight stutter
    const lines = $("#receiptFront").querySelectorAll(".r-row").length + 8;
    const dur = reduced ? 1 : Math.min(4200, 1100 + lines * 150);
    printer.classList.add("busy");
    const feed = [];
    const steps = 14;
    for (let i = 0; i <= steps; i++) {
      const p = i / steps;
      feed.push({ transform: `translateY(${-100 + p * 100}%)`, offset: p });
      if (i < steps) feed.push({ transform: `translateY(${-100 + p * 100 + 100 / steps * .7}%)`, offset: p + 1 / steps * .7 });
    }
    await mover.animate(feed, { duration: dur, easing: "linear", fill: "forwards" }).finished;
    printer.classList.remove("busy");
    mover.style.transform = "translateY(0)";
    mover.getAnimations().forEach(a => a.cancel());
    await wait(reduced ? 0 : 250);

    // tear off: small tug, printer floats away, receipt rises and starts spinning
    clip.classList.add("free");
    if (!reduced) await mover.animate([{ transform: "translateY(0)" }, { transform: "translateY(10px)" }, { transform: "translateY(0)" }], { duration: 260, easing: "ease-out" }).finished;
    printerWrap.style.transition = "transform .7s var(--ease), opacity .5s";
    const recH = $("#receiptFront").offsetHeight;
    const room = innerHeight * .5;
    const scale = Math.min(.92, room / recH);
    printer.style.transition = "opacity .4s, transform .6s var(--ease)";
    printer.style.opacity = "0"; printer.style.transform = "translateY(-30px) scale(.9)";
    printerWrap.querySelector(".slot").style.opacity = "0";
    mover.style.transition = "transform .8s var(--spring)";
    mover.style.transform = `translateY(-24px) scale(${scale})`;
    schedule.classList.add("show");
    if (!reduced) spinAnim = spinner.animate([{ transform: "rotateY(0deg)" }, { transform: "rotateY(360deg)" }], { duration: 5200, iterations: Infinity });
  }

  async function done(date) {
    if (!pending) return;
    const list = pending; pending = null;
    list.date = date || null;
    // settle the spin facing forward
    if (spinAnim) {
      const angle = ((spinAnim.currentTime || 0) % 5200) / 5200 * 360;
      spinAnim.cancel(); spinAnim = null;
      await spinner.animate([{ transform: `rotateY(${angle}deg)` }, { transform: "rotateY(360deg)" }], { duration: 500, easing: "cubic-bezier(.22,1,.36,1)" }).finished;
    }
    schedule.classList.remove("show");
    const cur = getComputedStyle(mover).transform;
    mover.style.transition = "none";
    if (!reduced) await mover.animate([{ transform: cur, opacity: 1 }, { transform: "translateY(55vh) scale(.15)", opacity: 0 }], { duration: 650, easing: "cubic-bezier(.55,0,.75,.2)", fill: "forwards" }).finished;
    S.lists.push(list);
    S.draft = { items: [], meals: [] };
    save();
    freshId = list.id;
    renderHome();
    stage.classList.remove("show");
    await wait(reduced ? 0 : 400);
    stage.hidden = true;
    mover.getAnimations().forEach(a => a.cancel());
    printer.style.opacity = ""; printer.style.transform = ""; printer.style.transition = "";
    printerWrap.querySelector(".slot").style.opacity = "";
    mover.style.transition = "";
  }
  goBtn.addEventListener("click", () => dateInput.value && done(dateInput.value));
  $("#schedSkip").addEventListener("click", () => done(null));

  /* ---------- Home screen icon ---------- */
  try {
    const c = document.createElement("canvas"); c.width = c.height = 180;
    const g = c.getContext("2d");
    const grd = g.createLinearGradient(0, 0, 180, 180);
    grd.addColorStop(0, "#ffb15a"); grd.addColorStop(.5, "#ff6f4f"); grd.addColorStop(1, "#4fbf66");
    g.fillStyle = grd; g.fillRect(0, 0, 180, 180);
    g.fillStyle = "rgba(255,255,255,.35)"; g.beginPath(); g.ellipse(60, 30, 110, 60, -.3, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#fffdf7";
    g.beginPath(); g.moveTo(50, 34); g.lineTo(130, 34); g.lineTo(130, 140);
    for (let x = 130; x > 50; x -= 10) { g.lineTo(x - 5, 148); g.lineTo(x - 10, 140); }
    g.closePath(); g.fill();
    g.fillStyle = "#23211d";
    [[62, 56, 56], [62, 74, 44], [62, 92, 50], [62, 110, 36]].forEach(([x, y, w]) => { g.fillRect(x, y, 6, 6); g.fillRect(x + 12, y, w, 6); });
    const link = document.createElement("link"); link.rel = "apple-touch-icon"; link.href = c.toDataURL("image/png");
    document.head.appendChild(link);
    const fav = document.createElement("link"); fav.rel = "icon"; fav.href = link.href; document.head.appendChild(fav);
  } catch (e) {}

  renderHome();
})();
</script>
</body>
</html>
